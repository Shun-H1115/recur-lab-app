[package]
name = "recur-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Interactive native recurrence phase-space laboratory"
license = "MIT"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.8", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
